<!DOCTYPE html>
<html translate="no" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="img/6_salsa_bottle/salsa_bottle.png">
    <script src="models/drawable-objects.class.js"></script>
    <script src="models/end-display.class.js"></script>
    <script src="models/movable-objects.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/small-Chicken.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/colectable-objects.class.js"></script>
    <script src="models/coins.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/clouds.class.js"></script>
    <script src="models/statusbars.class.js"></script>
    <script src="models/statusbar_healt.class.js"></script>
    <script src="models/statusbar_coin.class.js"></script>
    <script src="models/statusbar_bottle.class.js"></script>
    <script src="models/statusbar_endboss.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/background-objects.class.js"></script>
    <script src="models/Key-board.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="levels/level1.js"></script>
  </head>

  <body>
    <h1>El Pollo Loco</h1>
    <div id="fullscreen" class="canvas-wrapper">
      <img id="intro-img" class="intro-img" src="img/9_intro_outro_screens/start/startscreen_1.png" alt="">
      <div onclick="soundOfforOn()" id="mute" class="mute-button">
        <img class="sound-img" src="img/playicons/sound.png" alt="">
      </div>

      <img id="start-button" onclick="restartGame()" class="start-button" src="img/playicons/play.png" alt="">
      
      <canvas class="display_none" id="canvas" width="720" height="480">
      </canvas>
      <img onclick="openInfo()" class="info-button" id="info" src="img/playicons/info.png" alt="">
      <img class="fullscreen-button" onclick="fullscreen()" src="img/playicons/fullscreen.png" alt="">
      <div class="button-bar">
        <div class="gap_16">
          <img id="move-left" class="play-buttons" src="img/playicons/move-left.png" alt="">
          <img id="move-right" class="play-buttons" src="img/playicons/move-right.png" alt="">
        </div>
        <div class="gap_16">
          <img id="shoot" class="play-buttons" src="img/playicons/shoot.png" alt="">
          <img id="jump" class="play-buttons" src="img/playicons/jump.png" alt="">
        </div>
      </div>
    </div>

    <button onclick="activateTouchButtons()" id="activate-touch-button" class="button-for-touchbar">Activate touch buttons</button>

    <div id="tablet-buttons" class="button-bar-tablet">
        <img id="move-left" class="play-buttons" src="img/playicons/move-left.png" alt="">
        <img id="move-right" class="play-buttons" src="img/playicons/move-right.png" alt="">
        <img id="shoot" class="play-buttons" src="img/playicons/shoot.png" alt="">
        <img id="jump" class="play-buttons" src="img/playicons/jump.png" alt="">
    </div>

    <div id="discription-box" class="discription-wrapper">
      <span class="discription">
        <b>how to play:</b>
         > = run right / < = run left / space = jump / D = shot if
        you collected bottles. <br><br>
        jumb on enemies to kill them or shot with bottles.
        Boss killing with multiple bottles.
        lets kill the boss now..!!
        </span>
    </div>

    <div class="rotate-display">
      pleas rotate your display..
    </div>
  </body>
      <script src="js/game.js"></script>

</html>
