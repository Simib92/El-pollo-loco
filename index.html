  <body onload="">

    

    <h1>El Pollo Loco</h1>

    <div id="fullscreen" class="canvas-wrapper">
      <img id="intro-img" class="intro-img" src="img/9_intro_outro_screens/start/startscreen_1.png" alt="">
      <div onclick="soundOfforOn()" id="mute" class="mute-button">

    </div>
    </div>


    <div class="discription-wrapper">
      <span class="discription"
        ><b>how to play:</b> > = run right / < = left / space = jump / D = shot if

        jumb on enemies to kill them or shot with bottles.

        lets kill the boss now..!!</span
      >
